[workspace]
members = ["crates/scp-core", "crates/scp-target", "crates/scp-probe"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
hex = "0.4.3"
clap = { version = "4.6.8", features = ["derive"] }

chacha20poly1305 = { version = "0.10.1", features = ["std"] }
hkdf = "0.12.4"
hmac = "0.12.1"
sha2 = "0.10.9"
subtle = "2.6.1"
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
rand_chacha = "0.3.1"
rand_core = "0.6.4"

[profile.release]
debug = false
lto = "thin"

[profile.dev]
opt-level = 1
